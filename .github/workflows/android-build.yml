name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Make Gradlew Executable
        if: ${{ hashFiles('apps/mobile/android/gradlew') != '' }}
        run: chmod +x apps/mobile/android/gradlew

      - name: Build Android Debug APK
        if: ${{ hashFiles('apps/mobile/android/gradlew') != '' }}
        run: |
          cd apps/mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK Exists
        if: ${{ hashFiles('apps/mobile/android/gradlew') != '' }}
        run: |
          test -f apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK Artifact
        if: ${{ hashFiles('apps/mobile/android/gradlew') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: haiku-messenger-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
